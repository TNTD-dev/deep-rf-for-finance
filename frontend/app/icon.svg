<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- QuantArena tab icon — bolder than the SiteNav mark so it survives at 16px.
       Black rounded square + 3 cyan candles (bear/bull/bull), filled bodies
       and thick wicks so nothing disappears at favicon scale. -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#000000"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="5.4" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="0.8"/>

  <!-- Left bearish candle: wick + hollow body (outline) -->
  <line x1="8" y1="9" x2="8" y2="23" stroke="#22D3EE" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.7"/>
  <rect x="6" y="14" width="4" height="7" fill="none" stroke="#22D3EE" stroke-width="1.4" stroke-opacity="0.7"/>

  <!-- Center bullish candle: full wick + filled body (hero element) -->
  <line x1="16" y1="5" x2="16" y2="27" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="13" y="9" width="6" height="14" fill="#22D3EE"/>

  <!-- Right bullish candle: wick + hollow body, slightly bigger than left -->
  <line x1="24" y1="7" x2="24" y2="25" stroke="#22D3EE" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.8"/>
  <rect x="22" y="12" width="4" height="9" fill="none" stroke="#22D3EE" stroke-width="1.4" stroke-opacity="0.8"/>
</svg>
