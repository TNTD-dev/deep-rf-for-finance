[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-rf-finance"
version = "0.1.0"
description = "DRL vs LLM/agentic stock trading comparison on Vietnam VN30 — thesis project"
readme = "CLAUDE.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "TNTD" }]
license = { text = "MIT" }

dependencies = [
  # Config
  "python-dotenv>=1.0",
  # Data wrangling
  "pandas>=2.2",
  "numpy>=1.26,<2.0",
  "pyarrow>=15.0",
  # VN data sources
  "vnstock>=4.0,<5",
  # Indicators
  "ta>=0.11",
  # RL
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  # LLM
  "openai>=1.30",
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  # Web (PKG-11+)
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sse-starlette>=2.1",
  # Scraping (PKG-2)
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow assert False patterns in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
